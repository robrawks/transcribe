[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe"
version = "0.1.0"
description = "Local audio → timestamped transcript pipeline for DS2/MP3/WAV via mlx-whisper large-v3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rob" }]
dependencies = [
    "mlx-whisper>=0.4.0",
]

[project.scripts]
transcribe = "transcribe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["transcribe*"]
